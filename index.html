<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.pixelId = "69fe67a1bd3ec4d0d0904c2e";
    </script>
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-subids
      async
      defer
    ></script>
    <script
      src="https://cdn.utmify.com.br/scripts/pixel/pixel.js"
      async
      defer
    ></script>
    <!-- Manual Trigger for Tracking -->
    <script>
      document.addEventListener('click', function(e) {
        var target = e.target.closest('[data-utmify-checkout]');
        if (target) {
          // Track UTMify
          if (window.pixel && typeof window.pixel.track === 'function') {
            window.pixel.track('InitiateCheckout');
          }
          // Track Facebook
          if (typeof fbq === 'function') {
            fbq('track', 'InitiateCheckout');
          }
        }
      });
    </script>

    <!-- Facebook Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1998715230853668');
    fbq('track', 'PageView');
    </script>
    <!-- End Facebook Pixel Code -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lonchera Saludable</title>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1998715230853668&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
